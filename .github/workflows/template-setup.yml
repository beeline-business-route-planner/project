name: Template setup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-placeholders:
    # не выполнять в исходном репозитории-шаблоне, только в репозиториях,
    # созданных из него через "Use this template"
    if: github.repository != 'yurtsev/fastapi_template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Заменить плейсхолдеры именем проекта
        run: |
          set -euo pipefail

          NEW_NAME="${{ github.event.repository.name }}"

          TITLE=$(echo "$NEW_NAME" \
            | sed -E 's/[-_]+/ /g' \
            | awk '{for (i=1;i<=NF;i++) $i = toupper(substr($i,1,1)) substr($i,2); print}')

          PACKAGE=$(echo "$NEW_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')

          SLUG=$(echo "$PACKAGE" | tr '-' '_')

          echo "TITLE=$TITLE"
          echo "PACKAGE=$PACKAGE"
          echo "SLUG=$SLUG"

          grep -rlZ '__PROJECT_' --exclude-dir=.git . | xargs -0 -r sed -i \
            -e "s/__PROJECT_TITLE__/$TITLE/g" \
            -e "s/__PROJECT_PACKAGE__/$PACKAGE/g" \
            -e "s/__PROJECT_SLUG__/$SLUG/g"

      - name: Удалить этот workflow
        run: rm -f .github/workflows/template-setup.yml

      - name: Закоммитить результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: подставил имя проекта вместо плейсхолдеров шаблона"
          git push
