name: project

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    image: project_backend:latest
    container_name: migrate
    restart: "no"
    entrypoint: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE__POSTGRES_USERNAME: ${POSTGRES_USER}
      DATABASE__POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE__POSTGRES_DB: ${POSTGRES_DB}
      DATABASE__POSTGRES_HOST: postgres
      DATABASE__POSTGRES_PORT: 5432

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/$${S3_BUCKET_ANSWERS} local/$${S3_BUCKET_UPLOADS} local/$${S3_BUCKET_PLANS} local/$${S3_BUCKET_EXPORTS} &&
      mc anonymous set public local/$${S3_BUCKET_ANSWERS} &&
      mc anonymous set public local/$${S3_BUCKET_UPLOADS} &&
      mc anonymous set public local/$${S3_BUCKET_PLANS} &&
      mc anonymous set private local/$${S3_BUCKET_EXPORTS}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_ANSWERS: ${S3_BUCKET_ANSWERS}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS}
      S3_BUCKET_PLANS: ${S3_BUCKET_PLANS}
      S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-exports}

  minio-export-lifecycle:
    build: .
    image: project_backend:latest
    restart: "no"
    entrypoint: ["python", "-m", "src.core.s3.lifecycle"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      S3__ENDPOINT_URL: http://minio:9000
      S3__ACCESS_KEY: ${MINIO_ROOT_USER}
      S3__SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3__BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-exports}
      S3__EXPORT_PREFIX: ${S3_EXPORT_PREFIX:-exports}
      S3__EXPORT_RETENTION_HOURS: ${S3_EXPORT_RETENTION_HOURS:-24}

  backend:
    build: .
    image: project_backend:latest
    container_name: backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-export-lifecycle:
        condition: service_completed_successfully
    environment:
      DATABASE__POSTGRES_USERNAME: ${POSTGRES_USER}
      DATABASE__POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE__POSTGRES_DB: ${POSTGRES_DB}
      DATABASE__POSTGRES_HOST: postgres
      DATABASE__POSTGRES_PORT: 5432
      S3__ENDPOINT_URL: http://minio:9000
      S3__ACCESS_KEY: ${MINIO_ROOT_USER}
      S3__SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3__BUCKET_ANSWERS: ${S3_BUCKET_ANSWERS}
      S3__BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS}
      S3__BUCKET_PLANS: ${S3_BUCKET_PLANS}
      S3__BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-exports}
      S3__EXPORT_PREFIX: ${S3_EXPORT_PREFIX:-exports}
      S3__EXPORT_RETENTION_HOURS: ${S3_EXPORT_RETENTION_HOURS:-24}
      S3__PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:9000}
    ports:
      - "127.0.0.1:8000:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./deploy/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8080:8080"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  loki_data:
  grafana_data:
