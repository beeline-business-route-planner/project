name: beeline-backend

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beeline
      POSTGRES_USER: beeline
      POSTGRES_PASSWORD: beeline
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beeline -d beeline"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - beeline_pg:/var/lib/postgresql/data

  api:
    build: .
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && exec uvicorn beeline_backend.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://beeline:beeline@db:5432/beeline
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readiness', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  beeline_pg:
